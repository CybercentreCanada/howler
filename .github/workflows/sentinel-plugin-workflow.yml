name: Howler Plugin - Sentinel

on:
  push:
    branches:
      - main
    tags:
      - sentinel-v*
    paths:
      - plugins/sentinel/**
      - .github/workflows/sentinel-plugin-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  pull_request:
    branches:
      - main
    paths:
      - plugins/sentinel/**
      - .github/workflows/sentinel-plugin-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: sentinel
      component_dir: plugins/sentinel
      tag_prefix: sentinel-v
      allow_main_preview: false
      publish_release: ${{ inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Howler Sentinel Plugin Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sentinel
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: plugins/sentinel/.venv
          key: ${{ runner.os }}-poetry-3.12-sentinel-${{ hashFiles('plugins/sentinel/poetry.lock') }}
      - name: Check Poetry configuration
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --verbose --with dev,types
      - name: Run Ruff formatting checks
        run: poetry run ruff format sentinel --diff
      - name: Run Ruff lint checks
        run: poetry run ruff check sentinel --output-format=github
      - name: Run type checking
        run: poetry run type_check

  test:
    runs-on: ubuntu-latest
    name: Run Howler Sentinel Plugin Unit Tests
    needs: formatting
    defaults:
      run:
        working-directory: plugins/sentinel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start isolated API test dependencies
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: api/dev/docker-compose.yml
          up-flags: --build
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: plugins/sentinel/.venv
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-sentinel-${{ hashFiles('plugins/sentinel/poetry.lock') }}
      - name: Set up Howler API configuration
        working-directory: api
        run: |
          sudo mkdir -p /etc/howler/conf /etc/howler/lookups /var/log/howler
          sudo chmod a+rw /etc/howler/conf /etc/howler/lookups /var/log/howler
          cp build_scripts/classification.yml /etc/howler/conf/classification.yml
          cp build_scripts/mappings.yml /etc/howler/conf/mappings.yml
          cp test/unit/config.yml /etc/howler/conf/config.yml
      - name: Install dependencies and prepare lookups
        run: |
          poetry install --verbose --with dev,types
          poetry run mitre /etc/howler/lookups
          poetry run sigma
      - name: Verify Elasticsearch and Redis readiness
        run: |
          ready=false
          attempt=0
          while (( attempt < 60 )); do
            attempt=$((attempt + 1))
            if python -c 'import json; from urllib.request import urlopen; health = json.load(urlopen("http://127.0.0.1:9200/_cluster/health", timeout=3)); assert health.get("status") in {"green", "yellow"} and health.get("number_of_nodes", 0) >= 1' \
              && python -c 'import socket; redis = socket.create_connection(("127.0.0.1", 6379), timeout=3); redis.sendall(b"PING\r\n"); response = redis.recv(16); redis.close(); assert response.startswith(b"+PONG")'; then
              ready=true
              echo "Elasticsearch and Redis are ready"
              break
            fi
            sleep 3
          done
          if [[ "$ready" != "true" ]]; then
            echo "Elasticsearch or Redis did not become healthy within 180 seconds" >&2
            exit 1
          fi
      - name: Run tests
        run: poetry run pytest --cov=sentinel --cov-branch -rP -vv test/unit
      - name: Prepare pull request diff for coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" > diff.txt
      - name: Generate coverage report
        run: poetry run python build_scripts/coverage_reports.py
      - name: Add coverage PR comment
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        with:
          path: plugins/sentinel/coverage-results.md
          header: sentinel

  publish:
    if: needs.release_validation.outputs.channel == 'stable'
    needs:
      - release_validation
      - formatting
      - test
    runs-on: ubuntu-latest
    name: Build and publish stable Howler Sentinel Plugin
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/sentinel
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - name: Build package
        run: poetry build
      - name: Publish stable package to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
