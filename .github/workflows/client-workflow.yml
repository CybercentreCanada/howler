name: Howler Client

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "!client/LICENSE"
      - "!client/README.md"
      - "api/**"
      - .github/workflows/client-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
    tags:
      - client-v*
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "!client/LICENSE"
      - "!client/README.md"
      - "api/**"
      - .github/workflows/client-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: client
      component_dir: client
      tag_prefix: client-v
      allow_main_preview: false
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Howler Client Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./client/.venv
          key: venv-${{ hashFiles('client/poetry.lock') }}
      - name: Check for poetry config integrity
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info
      - name: Install Dependencies
        run: |
          poetry install --verbose --with test
      - name: Run ruff formatting checks
        run: |
          poetry run ruff format howler_client --diff
      - name: Run ruff linter checks
        run: |
          poetry run ruff check howler_client --output-format=github
      - name: Run type checking
        run: |
          poetry run type_check
  test:
    runs-on: ubuntu-latest

    name: Run Howler Client Unit Tests

    needs: formatting

    defaults:
      run:
        working-directory: client
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Get base depth of PR
        if: github.event_name == 'pull_request'
        id: base-depth
        working-directory: .
        run: |
          echo "base-depth=$((${{ github.event.pull_request.commits }} + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1 }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Setup Howler API environment
        working-directory: api
        run: |
          sudo mkdir -p /etc/howler/conf/
          sudo mkdir -p /etc/howler/lookups/
          sudo mkdir -p /var/log/howler
          sudo chmod a+rw /etc/howler/conf/
          sudo chmod a+rw /etc/howler/lookups/
          sudo chmod a+rw /var/log/howler
          cp build_scripts/classification.yml /etc/howler/conf/classification.yml
          cp build_scripts/mappings.yml /etc/howler/conf/mappings.yml
          cp ../client/test/config/config.ci.yml /etc/howler/conf/config.yml

      - name: Install API Dependencies
        working-directory: api
        run: |
          poetry install --verbose --with test,dev
          poetry run mitre /etc/howler/lookups
          poetry run sigma

      - name: Spin up test dependencies
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "client/test/docker-compose.yml"

      - name: Start Howler API server
        working-directory: api
        run: |
          TESTING=true poetry run flask --app howler.app run --no-reload &
          curl --fail-with-body --retry 15 --retry-delay 2 --retry-all-errors http://localhost:5000/api/apispec_v1.json

      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./client/.venv
          key: venv-${{ hashFiles('client/poetry.lock') }}

      - name: Install Dependencies
        run: |
          poetry install --verbose --with test

      - name: Generate random data, user accounts
        working-directory: api
        run: |
          poetry run python -m howler.odm.random_data

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          poetry run test
        env:
          WRITE_MARKDOWN: "true"

      - name: Add Failed Test PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: client/test-results.md
          header: client

      - name: Coverage Results
        if: steps.tests.outcome == 'success'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$merge_base..$HEAD_SHA"
            git diff "$merge_base..$HEAD_SHA" > diff.txt
          else
            rm -f diff.txt
          fi
          poetry run coverage_report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.tests.outcome == 'success' && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: client/coverage-results.md
          header: client

      - name: Force Failure if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: |
          exit 1
  push_to_pypi:
    if: needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build Howler Client Python Package
    permissions:
      contents: read
    needs:
      - release_validation
      - formatting
      - test
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: poetry build
      - name: Publish stable package to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish
