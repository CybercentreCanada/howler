name: Howler MCP

on:
  push:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  formatting:
    name: Validate Howler MCP Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Run ruff formatting checks
        run: poetry run ruff format howler_mcp --diff

      - name: Run ruff linter checks
        run: poetry run ruff check howler_mcp --output-format=github

  test:
    name: Run Howler MCP Unit Tests

    needs: formatting

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Build MCP image for network tests
        run: docker build -t howler-mcp-server:latest .

      - name: Spin up full test dependencies
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "mcp/docker-compose.yml"
          up-flags: "--profile full"

      - name: Run tests
        run: poetry run pytest test

      - name: Run network tests
        run: poetry run pytest test/test_network.py
        env:
          RUN_MCP_NETWORK_TESTS: "1"

  build_docker_image:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    name: Build and Publish Howler MCP Docker Image

    needs: test

    defaults:
      run:
        working-directory: mcp

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Install poetry
        shell: bash
        run: python3 -m pip install poetry

      - name: Extract Howler MCP version
        id: version
        run: |
          echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/7799abfc569cf293

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/howler-mcp
          tags: |
            type=raw,event=branch,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,event=branch,value=nightly,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=semver,pattern={{version}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}_{{sha}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push MCP Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/howler-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
