name: Howler MCP

on:
  push:
    branches:
      - main
    paths:
      - "mcp/**"
      - api/test/unit/config.yml
      - client/test/config/classification.yml
      - .github/workflows/mcp-workflow.yml
      - .github/actions/compose/**
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
    tags:
      - mcp-v*
  pull_request:
    branches:
      - main
    paths:
      - "mcp/**"
      - api/test/unit/config.yml
      - client/test/config/classification.yml
      - .github/workflows/mcp-workflow.yml
      - .github/actions/compose/**
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: mcp
      component_dir: mcp
      tag_prefix: mcp-v
      allow_main_preview: true
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Howler MCP Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Run ruff formatting checks
        run: poetry run ruff format howler_mcp --diff

      - name: Run ruff linter checks
        run: poetry run ruff check howler_mcp --output-format=github

  test:
    name: Run Howler MCP Unit Tests

    needs: formatting

    env:
      AUTH_CLIENT_ID: howler
      AUTH_CLIENT_SECRET: 09RhSF7tp0ShDdDMCszqI4zk8HMroTTZ

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Coverage diffs require the common ancestor, even when the base branch has advanced.
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Spin up full test dependencies
        uses: ./.github/actions/compose
        with:
          compose-file: mcp/docker-compose.yml
          profile: full
          services: howler-api elasticsearch redis keycloak
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Seed Howler API test hits
        run: docker compose -f docker-compose.yml exec -T howler-api python -m howler.odm.random_data users hits

      - name: Start Howler MCP server
        run: |
          poetry run coverage erase --data-file=.coverage.server
          HOWLER_API_HOST=localhost \
          HOWLER_API_BASE_URL=http://localhost:5000/api \
          AUTH_HOST=localhost \
          AUTH_TOKEN_URL=http://localhost:9100/realms/HogwartsMini/protocol/openid-connect/token \
          COVERAGE_FILE=.coverage.server poetry run coverage run -m howler_mcp.server > /tmp/howler-mcp-server.log 2>&1 &
          echo $! > mcp-server.pid
          curl --retry 15 --retry-delay 2 --retry-all-errors -sS -o /dev/null http://localhost:8000/mcp

      - name: Run tests
        id: tests
        run: poetry run test
        env:
          WRITE_MARKDOWN: "true"
          RUN_MCP_NETWORK_TESTS: "1"
          TEST_AUTH_USERNAME: goose
          TEST_AUTH_PASSWORD: goose
          TEST_AUTH_EMAIL: goose@howler.cyber.gc.ca
          HOWLER_API_BASE_URL: http://localhost:5000/api
          COVERAGE_FILE: .coverage.tests

      - name: Summarize failed tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          if [ -f test-results.md ]; then
            cat test-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tests failed before a report was generated. See the test logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print MCP server logs after failed tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "--- Howler MCP server logs ---"
          if [ -f /tmp/howler-mcp-server.log ]; then
            cat /tmp/howler-mcp-server.log
          else
            echo "MCP server log file was not created"
          fi

      - name: Stop MCP server and combine coverage
        if: always()
        run: |
          if [ -f mcp-server.pid ]; then
            kill "$(cat mcp-server.pid)" || true
            wait "$(cat mcp-server.pid)" || true
          fi
          poetry run coverage combine

      - name: Coverage Results
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_SHA"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$merge_base..$HEAD_SHA"
            git diff "$merge_base..$HEAD_SHA" > diff.txt
          else
            rm -f diff.txt
          fi
          poetry run coverage_report
          cat coverage-results.md >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Save coverage for GitHub Code Quality
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-mcp
          path: mcp/coverage.xml
          if-no-files-found: error
          retention-days: 1

  upload_coverage:
    name: Upload MCP coverage to GitHub Code Quality
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-coverage-mcp
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/mcp

  build_docker_image:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build and Publish Howler MCP Docker Image
    needs:
      - release_validation
      - test
    defaults:
      run:
        working-directory: mcp
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/7799abfc569cf293
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/howler-mcp
          flavor: latest=${{ needs.release_validation.outputs.channel == 'stable' }}
          tags: |
            type=raw,value=${{ needs.release_validation.outputs.version }},enable=${{ needs.release_validation.outputs.channel == 'stable' }}
            type=raw,value=nightly,enable=${{ needs.release_validation.outputs.channel == 'preview' }}
            type=sha,format=short
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push MCP Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ needs.release_validation.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/howler-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
