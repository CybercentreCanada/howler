name: Howler MCP

on:
  push:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop
      - rc/*
      - patch/*
    paths:
      - "mcp/**"
      - .github/workflows/mcp-workflow.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  formatting:
    name: Validate Howler MCP Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Run ruff formatting checks
        run: poetry run ruff format howler_mcp --diff

      - name: Run ruff linter checks
        run: poetry run ruff check howler_mcp --output-format=github

  test:
    name: Run Howler MCP Unit Tests

    needs: formatting

    env:
      AUTH_CLIENT_ID: howler
      AUTH_CLIENT_SECRET: 09RhSF7tp0ShDdDMCszqI4zk8HMroTTZ

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Get base depth of PR
        if: github.event_name == 'pull_request'
        id: base-depth
        working-directory: .
        run: echo "base-depth=$(expr ${{ github.event.pull_request.commits }} + 1)" >> $GITHUB_OUTPUT

      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1 }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Check Poetry configuration
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with dev

      - name: Spin up full test dependencies
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "mcp/docker-compose.yml"
          compose-flags: "--profile full"
          up-flags: "-d"
          services: |
            howler-api
            elasticsearch
            redis
            keycloak

      - name: Seed Howler API test hits
        run: docker compose -f docker-compose.yml exec -T howler-api python -m howler.odm.random_data users hits

      - name: Start Howler MCP server
        run: |
          poetry run coverage erase --data-file=.coverage.server
          HOWLER_API_HOST=localhost \
          HOWLER_API_BASE_URL=http://localhost:5000/api/v1 \
          AUTH_HOST=localhost \
          AUTH_TOKEN_URL=http://localhost:9100/realms/HogwartsMini/protocol/openid-connect/token \
          COVERAGE_FILE=.coverage.server poetry run coverage run -m howler_mcp.server > /tmp/howler-mcp-server.log 2>&1 &
          echo $! > mcp-server.pid
          curl --retry 15 --retry-delay 2 --retry-all-errors -sS -o /dev/null http://localhost:8000/mcp

      - name: Run tests
        id: tests
        continue-on-error: true
        run: poetry run test
        env:
          WRITE_MARKDOWN: "true"
          RUN_MCP_NETWORK_TESTS: "1"
          TEST_AUTH_USERNAME: goose
          TEST_AUTH_PASSWORD: goose
          TEST_AUTH_EMAIL: goose@howler.cyber.gc.ca
          HOWLER_API_BASE_URL: http://localhost:5000/api/v1
          COVERAGE_FILE: .coverage.tests

      - name: Print dependency logs after failed tests
        if: steps.tests.outcome == 'failure'
        run: |
          echo "--- Howler API and Keycloak logs ---"
          docker compose -f docker-compose.yml logs --no-color howler-api keycloak
          echo "--- Howler MCP server logs ---"
          if [ -f /tmp/howler-mcp-server.log ]; then
            cat /tmp/howler-mcp-server.log
          else
            echo "MCP server log file was not created"
          fi

      - name: Stop MCP server and combine coverage
        if: always()
        run: |
          if [ -f mcp-server.pid ]; then
            kill "$(cat mcp-server.pid)" || true
            wait "$(cat mcp-server.pid)" || true
          fi
          poetry run coverage combine

      - name: Add Failed Test PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        continue-on-error: true
        with:
          path: mcp/test-results.md
          header: mcp

      - name: Coverage Results
        if: steps.tests.outcome == 'success'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA"
            git diff "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA" > diff.txt
          fi
          poetry run coverage_report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.tests.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          path: mcp/coverage-results.md
          header: mcp

      - name: Force Failure if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  build_docker_image:
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    name: Build and Publish Howler MCP Docker Image

    needs: test

    defaults:
      run:
        working-directory: mcp

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Install poetry
        shell: bash
        run: python3 -m pip install poetry

      - name: Extract Howler MCP version
        id: version
        run: |
          echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/7799abfc569cf293

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/howler-mcp
          tags: |
            type=raw,event=branch,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,event=branch,value=nightly,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=semver,pattern={{version}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}
            type=raw,value=${{steps.version.outputs.version}}_{{branch}}_{{sha}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push MCP Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ steps.version.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/howler-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
