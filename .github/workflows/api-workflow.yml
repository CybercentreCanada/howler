name: Howler API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "!api/LICENSE"
      - "!api/README.md"
      - "!api/doc/**"
      - "!api/build_scripts/generate_classes.py"
      - .github/workflows/api-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
    tags:
      - api-v*
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "!api/LICENSE"
      - "!api/README.md"
      - "!api/doc/**"
      - "!api/build_scripts/generate_classes.py"
      - .github/workflows/api-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: api
      component_dir: api
      tag_prefix: api-v
      allow_main_preview: true
      publish_release: ${{ inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Howler API Code Quality

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poetry
        shell: bash
        run: python3 -m pip install poetry

      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./api/.venv
          key: venv-${{ hashFiles('api/poetry.lock') }}

      - name: Check for poetry config integrity
        run: |
          poetry --version
          poetry env use 3.12
          poetry check
          poetry env info

      - name: Install Dependencies
        run: poetry install --verbose --with test,dev

      - name: Run ruff formatting checks
        run: poetry run ruff format howler --diff

      - name: Run ruff linter checks
        run: poetry run ruff check howler --output-format=github

      - name: Run mypy type checking
        run: poetry run type_check

      - name: Run pyright type checking
        run: poetry run pyright --project pyproject.toml --level warning

      - name: Run hadolint formatting checks
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: api/Dockerfile
          failure-threshold: warning
          ignore: DL3018

  test:
    runs-on: ubuntu-latest

    name: Run Howler API Unit Tests

    needs: formatting

    defaults:
      run:
        working-directory: api
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Get base depth of PR
        if: github.event_name == 'pull_request'
        id: base-depth
        working-directory: .
        run: echo "base-depth=$((${{ github.event.pull_request.commits }} + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.base-depth.outputs.base-depth || 1 }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Spin up test dependencies
        uses: hoverkraft-tech/compose-action@v2.6.0
        with:
          compose-file: "api/dev/docker-compose.yml"
          up-flags: "--build"

      - name: Install poetry
        shell: bash
        run: python3 -m pip install poetry

      - uses: actions/cache@v4
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./api/.venv
          key: venv-${{ hashFiles('api/poetry.lock') }}

      - name: Setup Environment
        run: |
          sudo mkdir -p /etc/howler/conf/
          sudo mkdir -p /etc/howler/lookups/
          sudo mkdir -p /var/log/howler
          sudo chmod a+rw /etc/howler/conf/
          sudo chmod a+rw /etc/howler/lookups/
          sudo chmod a+rw /var/log/howler
          cp build_scripts/classification.yml /etc/howler/conf/classification.yml
          cp build_scripts/mappings.yml /etc/howler/conf/mappings.yml
          cp test/unit/config.yml /etc/howler/conf/config.yml

      - name: Install Dependencies
        run: |
          poetry install --verbose --with test,dev
          poetry run mitre /etc/howler/lookups
          poetry run sigma
      - name: Ensure docker compose is healthy
        run: poetry run python build_scripts/docker_health.py

      - name: Docker compose log dump on failure
        if: failure()
        run: |
          echo "Status:"
          docker compose ls
          docker compose ps

          echo "Logs:"
          docker compose logs
        working-directory: api/dev

      - name: Run tests
        id: tests
        continue-on-error: true
        run: poetry run test
        env:
          WRITE_MARKDOWN: "true"

      - name: Add Failed Test PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && steps.tests.outcome == 'failure'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: api/test-results.md
          header: api

      - name: Coverage Results
        if: steps.tests.outcome == 'success'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_SHA"
            merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$merge_base..$HEAD_SHA"
            git diff "$merge_base..$HEAD_SHA" > diff.txt
          else
            rm -f diff.txt
          fi
          poetry run coverage_report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.tests.outcome == 'success' && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        # https://github.com/marocchino/sticky-pull-request-comment/issues/227
        continue-on-error: true
        with:
          path: api/coverage-results.md
          header: api

      - name: Force Failure if Tests Failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  push_to_pypi:
    if: needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build and publish stable Howler API Python Package
    permissions:
      contents: read
    needs:
      - release_validation
      - formatting
      - test
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python3 -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: poetry build
      - name: Publish stable package to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          poetry config pypi-token.pypi "$PYPI_TOKEN"
          poetry publish

  push_to_registry:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build Howler API Docker Image
    needs:
      - release_validation
      - formatting
      - test
    defaults:
      run:
        working-directory: ./api
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/7799abfc569cf293
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/howler-api
          flavor: latest=${{ needs.release_validation.outputs.channel == 'stable' }}
          tags: |
            type=raw,value=${{ needs.release_validation.outputs.version }},enable=${{ needs.release_validation.outputs.channel == 'stable' }}
            type=raw,value=nightly,enable=${{ needs.release_validation.outputs.channel == 'preview' }}
            type=sha,format=short
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push API Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ needs.release_validation.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/howler-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
