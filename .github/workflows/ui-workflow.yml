name: Howler UI

on:
  push:
    branches:
      - main
    tags:
      - ui-v*
    paths:
      - "ui/**"
      - "!ui/LICENSE"
      - "!ui/README.md"
      - .github/workflows/ui-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  pull_request:
    branches:
      - main
    paths:
      - "ui/**"
      - "!ui/LICENSE"
      - "!ui/README.md"
      - .github/workflows/ui-workflow.yml
      - .github/workflows/release-validation.yml
      - scripts/validate_release.py
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish stable artifacts from a verified native component tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release_validation:
    uses: ./.github/workflows/release-validation.yml
    with:
      component: ui
      component_dir: ui
      tag_prefix: ui-v
      allow_main_preview: true
      publish_release: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: read

  formatting:
    name: Validate Howler UI Code Quality
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check translations
        run: python ../hooks/check_translation.py

      - name: Check for banned imports
        run: python ../hooks/find_bad_imports.py

      - name: Run type checking
        run: pnpm tsc --noEmit

      - name: Run oxfmt checks
        run: pnpm oxfmt src --check

      - name: Run oxlint checks
        run: pnpm oxlint src

      - name: Run unit tests
        run: pnpm test

      - name: Report coverage
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ui/target/coverage/coverage-summary.json
          json-final-path: ui/target/coverage/coverage-final.json

  push_npm_package:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Publish Howler UI to npm
    needs:
      - release_validation
      - formatting
    defaults:
      run:
        working-directory: ui
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
      - name: Install Node v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Set UI npm publication version
        id: npm-version
        env:
          CHANNEL: ${{ needs.release_validation.outputs.channel }}
          NATIVE_VERSION: ${{ needs.release_validation.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          if (pkg.version !== process.env.NATIVE_VERSION || !stable.test(pkg.version)) {
            throw new Error(`UI manifest ${pkg.version} does not match validated native version ${process.env.NATIVE_VERSION}`);
          }
          let version = pkg.version;
          let npmTag = 'latest';
          if (process.env.CHANNEL === 'preview') {
            const [major, minor] = version.split('.').map(BigInt);
            version = `${major}.${minor + 1n}.0-dev.${process.env.RUN_NUMBER}.${process.env.RUN_ATTEMPT}`;
            pkg.version = version;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8');
            npmTag = 'development';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nnpm_tag=${npmTag}\n`);
          NODE
      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean previous library build output
        run: rm -rf dist
      - name: Build UI library
        run: pnpm build-lib
        env:
          NODE_OPTIONS: --max-old-space-size=16384
      - name: Verify built package version
        env:
          EXPECTED_VERSION: ${{ steps.npm-version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_VERSION;
          const actual = JSON.parse(fs.readFileSync('dist/package.json', 'utf8')).version;
          if (actual !== expected) throw new Error(`Built package version ${actual} does not match ${expected}`);
          NODE
      - name: Publish built package
        run: pnpm publish --access public --no-git-checks --provenance --tag "$NPM_TAG"
        working-directory: ui/dist
        env:
          NPM_TAG: ${{ steps.npm-version.outputs.npm_tag }}

  push_docker_image:
    if: needs.release_validation.outputs.channel == 'preview' || needs.release_validation.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    name: Build Howler UI Docker Image
    needs:
      - release_validation
      - formatting
    defaults:
      run:
        working-directory: ui
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install Node v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Get pnpm store path
        id: pnpm-cache-dir
        run: echo "PNPM_CACHE_DIR=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        name: Define a cache for node_modules
        with:
          path: |
            ${{ steps.pnpm-cache-dir.outputs.PNPM_CACHE_DIR }}
            ~/.pnpm-store
            ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        run: pnpm build
        env:
          VITE_BRANCH: ${{ github.ref }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=16384
      - name: Set up chainctl with howler identity
        uses: chainguard-dev/setup-chainctl@main
        with:
          identity: 42b9b0076fcee50f3ee6d013eadb93841a051303/7799abfc569cf293
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cccs/howler-ui
          flavor: latest=${{ needs.release_validation.outputs.channel == 'stable' }}
          tags: |
            type=raw,value=${{ needs.release_validation.outputs.version }},enable=${{ needs.release_validation.outputs.channel == 'stable' }}
            type=raw,value=nightly,enable=${{ needs.release_validation.outputs.channel == 'preview' }}
            type=sha,format=short
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push UI Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            version=${{ needs.release_validation.outputs.version }}
            branch=${{ github.ref }}
            commit=${{ github.sha }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/cccs/howler-ui
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
