map $http_x_forwarded_proto $howler_external_scheme {
    http http;
    https https;
    default $scheme;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Use the forwarded scheme (for TLS-terminating ingress) and request host per request.
    sub_filter "__HOWLER_BASE_URL__" "$howler_external_scheme://$host";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
